<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101827">
<title>人工生命シミュレーター</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#1b2738;--line:#34445b;--text:#e8eef7;--muted:#9aabc1;--green:#75e0a2;--food:#f6d365}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
main{width:min(100%,760px);margin:auto;padding:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
h1{font-size:19px;margin:0;font-weight:750}
.sub{font-size:11px;color:var(--muted);margin-top:3px}
.pill{font-size:11px;color:var(--green);border:1px solid #37634c;border-radius:99px;padding:5px 9px;white-space:nowrap}
#worldWrap{position:relative;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#0b1421;box-shadow:0 8px 30px #0004}
canvas{display:block;width:100%;height:auto;touch-action:manipulation}
.overlay{position:absolute;left:10px;top:9px;font-size:11px;color:#b8c7d9;background:#101827bb;padding:5px 8px;border-radius:7px;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 9px;min-width:0}
.stat span{display:block;color:var(--muted);font-size:10px}
.stat strong{display:block;font-size:18px;margin-top:1px;font-variant-numeric:tabular-nums}
.controls{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:10px}
.buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{border:1px solid var(--line);border-radius:9px;background:#29384d;color:var(--text);padding:11px 8px;font-size:13px;font-weight:650;min-height:42px}
button.primary{background:#236b4b;border-color:#3c986d}
button:active{transform:scale(.98)}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px;margin-top:13px}
.setting label{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#c4d0df;margin-bottom:6px}
.setting output{color:var(--green);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#69d99a}
.help{font-size:11px;line-height:1.65;color:var(--muted);margin:10px 2px 3px}
.legend{display:flex;flex-wrap:wrap;gap:13px;font-size:11px;color:var(--muted);margin:9px 2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
@media(max-width:380px){main{padding:9px}.stats{gap:5px}.stat{padding:7px}.stat strong{font-size:16px}.settings{gap:11px}}
</style>
</head>
<body>
<main>
<header><div><h1>人工生命シミュレーター</h1><div class="sub">食べる・動く・増える・死ぬ、小さな生態系</div></div><div class="pill">LIVE ECOSYSTEM</div></header>
<div id="worldWrap"><canvas id="world" width="720" height="480" aria-label="人工生命の生態系"></canvas><div class="overlay">画面をタップ：その場所に餌を追加</div></div>
<section class="stats">
 <div class="stat"><span>生物</span><strong id="creatureCount">0</strong></div>
 <div class="stat"><span>餌</span><strong id="foodCount">0</strong></div>
 <div class="stat"><span>世代</span><strong id="generation">1</strong></div>
 <div class="stat"><span>経過時間</span><strong id="elapsed">0秒</strong></div>
</section>
<section class="controls">
 <div class="buttons">
  <button class="primary" id="toggle">⏸ 一時停止</button>
  <button id="addFood">＋ 餌を追加</button>
  <button id="reset">↻ リセット</button>
 </div>
 <div class="settings">
  <div class="setting"><label for="speed">シミュレーション速度 <output id="speedVal">1.0倍</output></label><input id="speed" type="range" min=".25" max="3" step=".25" value="1"></div>
  <div class="setting"><label for="foodRate">餌の発生量 <output id="foodVal">標準</output></label><input id="foodRate" type="range" min="0" max="3" step="1" value="1"></div>
  <div class="setting"><label for="birth">繁殖しやすさ <output id="birthVal">標準</output></label><input id="birth" type="range" min=".5" max="2" step=".25" value="1"></div>
  <div class="setting"><label for="life">寿命 <output id="lifeVal">標準</output></label><input id="life" type="range" min=".6" max="1.8" step=".2" value="1"></div>
 </div>
</section>
<div class="legend"><span><i class="dot" style="background:#78e0a0"></i>生物（大きさ＝エネルギー）</span><span><i class="dot" style="background:#f6d365"></i>餌</span><span><i class="dot" style="background:#7b91b1"></i>生まれたばかり</span></div>
<p class="help">生物は近くの餌に向かって移動します。餌を食べるとエネルギーが増え、十分に蓄えると分裂して子孫を残します。時間の経過や移動でもエネルギーを消費し、尽きると死にます。餌が少ないと個体数も減っていきます。</p>
</main>
<script>
(()=>{
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
const W=720,H=480;
const $=id=>document.getElementById(id);
let creatures=[],foods=[],running=true,elapsed=0,generation=1,last=0,foodClock=0;
let speed=1,foodRate=1,birthRate=1,lifeRate=1;
const rand=(a,b)=>a+Math.random()*(b-a);
function newCreature(x=rand(15,W-15),y=rand(15,H-15),energy=rand(45,75),age=0,gen=1){
 return {x,y,vx:rand(-1,1),vy:rand(-1,1),energy,age,gen,angle:rand(0,Math.PI*2),color:rand(0,1)};
}
function addFood(x=rand(12,W-12),y=rand(12,H-12)){foods.push({x,y,r:rand(2.4,3.8),pulse:rand(0,6)});}
function reset(){
 creatures=[];foods=[];elapsed=0;generation=1;foodClock=0;
 for(let i=0;i<24;i++)creatures.push(newCreature());
 for(let i=0;i<115;i++)addFood();
 updateStats();
}
function addFoodBurst(n=35){for(let i=0;i<n;i++)addFood();}
function update(dt){
 const step=dt*speed;
 elapsed+=step;
 foodClock+=step;
 const spawnInterval=foodRate===0?Infinity:Math.max(.22,1.55/foodRate);
 while(foodClock>spawnInterval){foodClock-=spawnInterval;addFood();}
 // Food slowly drifts into the ecosystem
 for(let f of foods){f.pulse+=step;f.x+=Math.sin(f.pulse*.7)*.035;f.y+=Math.cos(f.pulse*.5)*.035;}
 for(let i=creatures.length-1;i>=0;i--){
  const c=creatures[i];c.age+=step;
  c.energy-=step*(.9+Math.hypot(c.vx,c.vy)*.23);
  if(c.energy<=0||c.age>155*lifeRate){creatures.splice(i,1);continue;}
  // Seek the nearest food within sensing range
  let target=null,best=112*112;
  for(let j=0;j<foods.length;j++){let f=foods[j],dx=f.x-c.x,dy=f.y-c.y,d=dx*dx+dy*dy;if(d<best){best=d;target=j;}}
  if(target!==null){let f=foods[target],dx=f.x-c.x,dy=f.y-c.y,d=Math.hypot(dx,dy)||1;c.vx+=dx/d*.075;c.vy+=dy/d*.075;}
  // Small wandering keeps motion organic
  c.vx+=rand(-.11,.11);c.vy+=rand(-.11,.11);
  let v=Math.hypot(c.vx,c.vy),max=1.65;
  if(v>max){c.vx=c.vx/v*max;c.vy=c.vy/v*max;}
  c.x+=c.vx*step*2.2;c.y+=c.vy*step*2.2;
  if(c.x<7||c.x>W-7)c.vx*=-1;
  if(c.y<7||c.y>H-7)c.vy*=-1;
  c.x=Math.max(7,Math.min(W-7,c.x));c.y=Math.max(7,Math.min(H-7,c.y));
  // Eat nearby food
  for(let j=foods.length-1;j>=0;j--){let f=foods[j];if((c.x-f.x)**2+(c.y-f.y)**2<=(c.energy>80?11:9)**2){c.energy=Math.min(150,c.energy+25);foods.splice(j,1);break;}}
  // Reproduce by binary fission when energy is sufficient
  if(c.energy>112/birthRate&&creatures.length<180){
   c.energy*=.48;let child=newCreature(c.x+rand(-12,12),c.y+rand(-12,12),c.energy,0,c.gen+1);
   child.vx=-c.vx+rand(-.5,.5);child.vy=-c.vy+rand(-.5,.5);
   creatures.push(child);generation=Math.max(generation,child.gen);
  }
 }
 if(foods.length>500)foods.splice(0,foods.length-500);
 updateStats();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#0b1421';ctx.fillRect(0,0,W,H);
 // subtle habitat grid
 ctx.strokeStyle='rgba(120,150,180,.055)';ctx.lineWidth=1;
 for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
 for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
 for(let f of foods){ctx.beginPath();ctx.arc(f.x,f.y,f.r+Math.sin(f.pulse)*.35,0,Math.PI*2);ctx.fillStyle='#f6d365';ctx.shadowColor='#f6d365';ctx.shadowBlur=7;ctx.fill();}
 ctx.shadowBlur=0;
 for(let c of creatures){
  const r=3.3+Math.min(4.5,c.energy/32),young=c.age<9;
  ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);
  ctx.fillStyle=young?'#7b91b1':c.energy>85?'#a2f0b9':'#58c987';
  ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=young?3:7;ctx.fill();
  ctx.shadowBlur=0;
  // direction marker
  ctx.beginPath();ctx.arc(c.x+c.vx*2.1,c.y+c.vy*2.1,1.15,0,Math.PI*2);ctx.fillStyle='#eafff0';ctx.fill();
 }
 ctx.shadowBlur=0;
}
function updateStats(){
 $('creatureCount').textContent=creatures.length;
 $('foodCount').textContent=foods.length;
 $('generation').textContent=generation;
 $('elapsed').textContent=Math.floor(elapsed)+'秒';
}
function frame(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;if(running)update(dt);draw();requestAnimationFrame(frame);}
$('toggle').onclick=()=>{running=!running;$('toggle').textContent=running?'⏸ 一時停止':'▶ 再開';$('toggle').classList.toggle('primary',running);};
$('addFood').onclick=()=>addFoodBurst(45);
$('reset').onclick=()=>{reset();running=true;$('toggle').textContent='⏸ 一時停止';$('toggle').classList.add('primary');};
$('speed').oninput=e=>{speed=+e.target.value;$('speedVal').textContent=speed.toFixed(2).replace(/0$/,'')+'倍';};
$('foodRate').oninput=e=>{foodRate=+e.target.value;$('foodVal').textContent=['なし','少なめ','標準','多め'][foodRate];};
$('birth').oninput=e=>{birthRate=+e.target.value;$('birthVal').textContent=['控えめ','やや控えめ','標準','活発','とても活発'][Math.round((birthRate-.5)/.25)];};
$('life').oninput=e=>{lifeRate=+e.target.value;$('lifeVal').textContent=lifeRate===1?'標準':lifeRate<1?'短め':'長め';};
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;for(let i=0;i<12;i++)addFood(x+rand(-25,25),y+rand(-25,25));});
reset();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
