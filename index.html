<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人工生命シミュレーター</title><style>body{margin:0;background:#101827;color:#e8eef7;font-family:sans-serif}#top{padding:10px;text-align:center}canvas{display:block;width:100%;max-width:720px;margin:auto;background:#0b1421;border:1px solid #34445b}#stats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:10px}span{background:#1b2738;padding:6px 10px;border-radius:8px}</style></head><body><div id="top"><h2>人工生命シミュレーター Evolution</h2></div><canvas id="world" width="720" height="480"></canvas><div id="stats"><span id="c"></span><span id="g"></span><span id="s"></span><span id="v"></span><span id="l"></span></div><script>const cv=world,ctx=cv.getContext('2d');const W=720,H=480;let foods=[],creatures=[],generation=1;const K='artificial_life_evo_v2';const rnd=(a,b)=>a+Math.random()*(b-a);function addFood(x=rnd(0,W),y=rnd(0,H)){foods.push({x,y})}function newCreature(x=rnd(0,W),y=rnd(0,H),energy=70,age=0,gen=1,speed=rnd(.8,2.2),view=rnd(70,130),life=rnd(120,220)){return{x,y,vx:rnd(-1,1),vy:rnd(-1,1),energy,age,gen,speed,view,life}}function reset(){foods=[];creatures=[];generation=1;for(let i=0;i<24;i++)creatures.push(newCreature());for(let i=0;i<120;i++)addFood();save()}function save(){localStorage.setItem(K,JSON.stringify({foods,creatures,generation,time:Date.now()}))}function load(){let r=localStorage.getItem(K);if(!r){reset();return;}let d=JSON.parse(r);foods=d.foods||[];creatures=d.creatures||[];generation=d.generation||1;let diff=Math.min((Date.now()-d.time)/1000,86400);while(diff>0){update(.5);diff-=.5}}function update(dt){if(Math.random()<0.08)addFood();for(let i=creatures.length-1;i>=0;i--){let c=creatures[i];c.age+=dt;c.energy-=dt*(0.6+c.speed*0.25);if(c.energy<=0||c.age>c.life){creatures.splice(i,1);continue;}let target=null,best=c.view*c.view;for(let f of foods){let dx=f.x-c.x,dy=f.y-c.y,d=dx*dx+dy*dy;if(d<best){best=d;target=f}}if(target){let dx=target.x-c.x,dy=target.y-c.y,m=Math.hypot(dx,dy)||1;c.vx+=dx/m*0.05*c.speed;c.vy+=dy/m*0.05*c.speed}else{c.vx+=rnd(-.08,.08);c.vy+=rnd(-.08,.08)}let vmax=c.speed;if(Math.hypot(c.vx,c.vy)>vmax){let m=Math.hypot(c.vx,c.vy);c.vx=c.vx/m*vmax;c.vy=c.vy/m*vmax}c.x+=c.vx*dt*2;c.y+=c.vy*dt*2;c.x=Math.max(0,Math.min(W,c.x));c.y=Math.max(0,Math.min(H,c.y));for(let j=foods.length-1;j>=0;j--){if((foods[j].x-c.x)**2+(foods[j].y-c.y)**2<100){c.energy+=25;foods.splice(j,1);break}}if(c.energy>120&&creatures.length<250){c.energy*=.5;let child=newCreature(c.x,c.y,c.energy,0,c.gen+1,Math.max(.4,c.speed+rnd(-.15,.15)),Math.max(30,c.view+rnd(-10,10)),Math.max(60,c.life+rnd(-15,15)));creatures.push(child);generation=Math.max(generation,child.gen)}}if(foods.length>600)foods.splice(0,foods.length-600)}function draw(){ctx.fillStyle='#0b1421';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f6d365';foods.forEach(f=>ctx.fillRect(f.x,f.y,3,3));for(let c of creatures){ctx.fillStyle=c.speed>2?'#ff8080':c.view>120?'#80c0ff':'#78e0a0';ctx.beginPath();ctx.arc(c.x,c.y,3+c.energy/40,0,6.28);ctx.fill()}let avg=(k)=>creatures.length?(creatures.reduce((a,b)=>a+b[k],0)/creatures.length).toFixed(1):0;document.getElementById('c').textContent='生物:'+creatures.length;document.getElementById('g').textContent='世代:'+generation;document.getElementById('s').textContent='平均速度:'+avg('speed');document.getElementById('v').textContent='平均視野:'+avg('view');document.getElementById('l').textContent='平均寿命:'+avg('life')}let last=0;function loop(t){let dt=Math.min(.05,(t-last)/1000||.05);last=t;update(dt);draw();if(Math.random()<0.03)save();requestAnimationFrame(loop)}load();window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});requestAnimationFrame(loop);</script></body></html>
